<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IPA Tool{% endblock %}</title>
  {% if legacy %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/legacy.css') }}">
  {% else %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% endif %}
</head>
<body class="{% if not allow_server_save %}no-server-save{% endif %}">
  <main class="container">
    <header>
      <h1>IPA Tool{% if legacy %} <span class="legacy-badge">legacy</span>{% endif %}</h1>
    </header>
    {% block content %}{% endblock %}
    <footer class="site-footer">
      Free software under the <a href="https://www.gnu.org/licenses/agpl-3.0.html" rel="noopener" target="_blank">GNU AGPL-3.0</a>
      | <a href="{{ url_for('ui.source_archive') }}">Source code</a>
      {% if repo_url %}| <a href="{{ repo_url }}" rel="noopener" target="_blank">{{ 'GitHub' if 'github.com' in repo_url else 'Repository' }}</a>{% endif %}
    </footer>
  </main>
  <script nonce="{{ csp_nonce }}">
    window.APP_BASE_URL = {{ request.script_root|default('', true)|tojson }};
    window.APP_ALLOW_SERVER_SAVE = {{ allow_server_save|default(false)|tojson }};
  </script>
  {% if legacy %}
  <script src="{{ url_for('static', filename='js/legacy.js') }}"></script>
  {% else %}
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% endif %}
</body>
</html>
