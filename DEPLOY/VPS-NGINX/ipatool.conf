# /etc/nginx/sites-available/ipatool.conf  (link it into sites-enabled)
# Replace ipa.example.org with your domain; certificate: certbot --nginx -d ipa.example.org
server {
    listen 80;
    server_name ipa.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ipa.example.org;
    ssl_certificate     /etc/letsencrypt/live/ipa.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipa.example.org/privkey.pem;

    large_client_header_buffers 4 16k;   # the session spans a few cookies

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;              # IPAs are streamed (often 1-4 GB)
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
