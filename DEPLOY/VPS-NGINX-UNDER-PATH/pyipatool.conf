# /etc/nginx/snippets/pyipatool.conf
# Include it inside the server { } block of the existing site:
#     include /etc/nginx/snippets/pyipatool.conf;
# The app is then at https://<domain>/ipa/
location = /ipa { return 301 /ipa/; }
location ^~ /ipa/ {                       # ^~: the site's regex locations don't take it over
    proxy_pass http://127.0.0.1:5002/;    # the trailing / strips /ipa
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Prefix /ipa;
    proxy_intercept_errors off;           # the app's own error answers must reach the page
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
